name: test

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'electron/**'
      - 'vscode/src/**'
      - 'vscode/scripts/**'
      - 'ui/src/**'
      - 'ui/vite.config.ts'
      - 'chromium-xtension/src/**'
      - 'chromium-xtension/popup.js'
      - 'chromium-xtension/vite.config.ts'
      - 'website-app/src/**'
      - 'website-app/package.json'
      - 'website-app/tsconfig.json'
      - 'website-app/vite.config.ts'
      - 'tauri/src/**'
      - 'tauri/tests/**'
      - 'tauri/Cargo.toml'
      - 'tauri/Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'electron/**'
      - 'vscode/src/**'
      - 'vscode/scripts/**'
      - 'ui/src/**'
      - 'ui/vite.config.ts'
      - 'chromium-xtension/src/**'
      - 'chromium-xtension/popup.js'
      - 'chromium-xtension/vite.config.ts'
      - 'website-app/src/**'
      - 'website-app/package.json'
      - 'website-app/tsconfig.json'
      - 'website-app/vite.config.ts'
      - 'tauri/src/**'
      - 'tauri/tests/**'
      - 'tauri/Cargo.toml'
      - 'tauri/Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:contracts
      - run: pnpm run test:node
      - run: pnpm run test:update-contracts

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:translations

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ui

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:electron

  host-variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test VS Code host
        run: pnpm run test:vscode
      - name: Test Chromium host
        run: pnpm run test:chromium
      - name: Build shared UI
        run: pnpm run build:ui
      - name: Build Electron UI variant
        run: pnpm run build:ui:electron
      - name: Build VS Code host
        run: pnpm run build:vscode
      - name: Build Chromium host
        run: pnpm run build:chromium
      - name: Typecheck Web app
        run: pnpm --dir website-app typecheck
      - name: Build Web app
        run: pnpm --dir website-app build

  tauri:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared UI bundle
        run: pnpm run build:ui:tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm run test:tauri

  tauri-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared UI bundle
        run: pnpm run build:ui:tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage and check 85% threshold
        run: |
          cargo llvm-cov --manifest-path tauri/Cargo.toml --workspace \
            --ignore-filename-regex "dispatcher.rs|host_message.rs|bootstrap.rs|app_state.rs|preload/|main.rs|lib.rs" \
            --text -- --test-threads=1 2>&1 | tee coverage.txt

          pct=$(grep "^TOTAL" coverage.txt | awk '{print $NF}' | sed 's/%//')
          echo "=== Total coverage (excluding Tauri-runtime modules): ${pct}% ==="

          if [ "$(echo "$pct < 85" | bc -l)" -eq 1 ]; then
            echo "FAIL: Coverage ${pct}% is below 85% threshold"
            tail -30 coverage.txt
            exit 1
          fi
          echo "PASS: Coverage ${pct}% meets 85% threshold"

          cargo llvm-cov --manifest-path tauri/Cargo.toml --workspace \
            --ignore-filename-regex "dispatcher.rs|host_message.rs|bootstrap.rs|app_state.rs|preload/|main.rs|lib.rs" \
            --lcov --output-path lcov.info -- --test-threads=1
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: tauri-coverage
          path: lcov.info
